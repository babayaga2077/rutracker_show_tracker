# FlareSolverr: headless Chrome that clears the Cloudflare JS challenge and
# hands back cf_clearance cookies. The bot itself stays on systemd; only this
# runs in Docker.
#
#   docker compose up -d
#   docker compose logs -f flaresolverr
#
# IMPORTANT: FlareSolverr and the bot must egress from the same public IP,
# because cf_clearance is bound to the address that solved the challenge.
# Running both on this box satisfies that automatically.

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      # Bound to localhost only — this is an unauthenticated fetch-anything
      # service, do not expose it to the internet.
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Moscow
      # Browser stays warm between solves; drop to 300 if RAM is tight.
      - BROWSER_TIMEOUT=40000
    # Headless Chrome is memory-hungry and leaks over long uptimes.
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
