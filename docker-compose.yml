# FlareSolverr: headless Chrome that clears the Cloudflare JS challenge and
# hands back cf_clearance cookies. The bot itself stays on systemd; only this
# runs in Docker.
#
#   docker compose up -d
#   docker compose logs -f flaresolverr
#
# IMPORTANT: FlareSolverr and the bot must egress from the same public IP,
# because cf_clearance is bound to the address that solved the challenge.
# Running both on this box satisfies that automatically.

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      # Bound to localhost only — this is an unauthenticated fetch-anything
      # service, do not expose it to the internet.
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Moscow
      # Generous, because Chrome starts very slowly on a burst-vCPU instance.
      # FlareSolverr's own startup self-test gives up at 120s and the container
      # then dies, so this needs headroom on small boxes.
      - BROWSER_TIMEOUT=180000
    # Chrome maps a lot of shared memory; 256m is where it starts crashing.
    shm_size: 1g
    # No mem_limit on purpose. Capping it below what Chrome wants turns a slow
    # start into an OOM kill. Control memory with host swap instead.
    healthcheck:
      # The image has no curl, so probe with the Python that's already in it.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8191/health', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
